<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7f2" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='17' fill='%2320251f'/%3E%3Cpath d='M18 33l9 9 19-22' fill='none' stroke='%23d6ef78' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <title>任务清单</title>
    <style>
      :root { --ink:#20251f; --muted:#767b73; --paper:#f7f7f2; --card:#fffefa; --line:#e1e4da; --lime:#d6ef78; --green:#31664a; --blue:#dce9f6; --shadow:0 16px 40px rgba(40,48,32,.08); }
      * { box-sizing:border-box; }
      body { margin:0; min-height:100vh; color:var(--ink); font:15px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, "Microsoft YaHei", sans-serif; background:radial-gradient(circle at 90% 5%,#edf5c7 0,transparent 25rem),var(--paper); }
      button,input { font:inherit; } button { cursor:pointer; }
      .app { width:calc(100% - 48px); margin:0 auto; padding:24px 0 36px; }
      header { display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; }
      .header-left { display:flex; align-items:center; gap:10px; }.sidebar-toggle { display:grid; place-items:center; width:34px; height:34px; border:1px solid var(--line); border-radius:10px; background:rgba(255,255,255,.6); color:var(--ink); font-size:18px; line-height:1; }.sidebar-toggle:hover { background:#e9eddc; }
      .brand { display:flex; gap:12px; align-items:center; font-size:20px; font-weight:800; letter-spacing:-.04em; }
      .mark { display:grid; place-items:center; width:35px; height:35px; border-radius:11px; background:var(--ink); color:var(--lime); font-size:22px; }
      .date { color:var(--muted); font-weight:600; }
      .layout { display:block; }.drawer-backdrop { position:fixed; inset:0; z-index:9; background:rgba(28,34,26,.22); backdrop-filter:blur(2px); opacity:0; pointer-events:none; transition:opacity .22s ease; }.sidebar-open .drawer-backdrop { opacity:1; pointer-events:auto; }
      aside { position:fixed; z-index:10; top:0; bottom:0; left:0; width:285px; padding:88px 20px 28px; overflow-y:auto; background:var(--card); border-right:1px solid var(--line); box-shadow:18px 0 42px rgba(38,47,33,.12); transform:translateX(calc(-100% - 24px)); transition:transform .24s ease; } .sidebar-open aside { transform:translateX(0); }.nav { display:grid; gap:7px; }
      .nav button { display:flex; justify-content:space-between; border:0; padding:11px 12px; color:var(--muted); border-radius:10px; background:transparent; text-align:left; }
      .nav button.active { color:var(--ink); background:#e9eddc; font-weight:750; }.nav button:hover { background:#eef0e8; color:var(--ink); }
      .count { font-size:12px; background:#fff; border-radius:999px; padding:1px 7px; }.tip { margin:32px 12px; color:var(--muted); font-size:13px; }
      main { min-width:0; }.heading { display:flex; align-items:end; justify-content:space-between; gap:20px; margin-bottom:18px; }.heading h1 { margin:0; font-size:34px; letter-spacing:-.055em; line-height:1; }.heading p { margin:8px 0 0; color:var(--muted); }
      .heading-actions { display:flex; align-items:center; gap:10px; }.add-task,.backup-button,.memo-button { border-radius:12px; padding:11px 16px; font-weight:700; white-space:nowrap; }.add-task { border:0; background:var(--ink); color:white; box-shadow:var(--shadow); }.add-task:hover { transform:translateY(-1px); }.backup-button,.memo-button { border:1px solid var(--line); color:var(--ink); background:rgba(255,255,255,.72); }.backup-button:hover,.memo-button:hover { background:#e9eddc; }
      .summary { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:18px; }.metric { padding:12px 15px; border:1px solid var(--line); background:rgba(255,255,255,.47); border-radius:12px; }.metric b { display:block; font-size:21px; letter-spacing:-.04em; }.metric span { font-size:12px; color:var(--muted); }
      .tasks { display:grid; gap:12px; }.task { position:relative; overflow:hidden; padding:18px; border:1px solid var(--line); border-radius:17px; background:var(--card); box-shadow:0 3px 13px rgba(41,48,32,.025); }.task.done { opacity:.64; }.task.dragging,.subtask.dragging { opacity:.38; }.task.drop-before { box-shadow:inset 0 3px 0 var(--green); }.task.drop-after { box-shadow:inset 0 -3px 0 var(--green); }.task-top { display:flex; align-items:flex-start; gap:13px; }.check { flex:0 0 22px; width:22px; height:22px; margin:1px 0 0; accent-color:var(--green); }.drag-handle { flex:0 0 15px; color:#aeb4a8; font-size:18px; letter-spacing:-4px; line-height:22px; cursor:grab; user-select:none; opacity:0; transition:opacity .16s; }.drag-handle:active { cursor:grabbing; }.task:hover > .task-top .drag-handle,.task:focus-within > .task-top .drag-handle,.subtask:hover .drag-handle,.subtask:focus-within .drag-handle { opacity:1; }.task-title,.sub-title { flex:1; min-width:0; width:100%; border:0; background:transparent; outline:none; resize:none; overflow:hidden; font:inherit; line-height:1.45; padding:1px 3px; border-radius:5px; }.task-title { font-weight:800; font-size:17px; letter-spacing:-.02em; }.sub-title { color:#4f564d; }.task-title:hover,.sub-title:hover { background:#f2f4ec; }.task-title:focus,.sub-title:focus { background:#eef5d7; outline:2px solid #c5dd73; }.task.done .task-title,.subtask.completed .sub-title { text-decoration:line-through; color:#9ba097; }.delete { border:0; background:transparent; color:#a5a9a1; font-size:20px; line-height:1; padding:0 2px; }.delete:hover { color:#be524e; }
      .progress-row { display:flex; align-items:center; gap:9px; margin:15px 0 13px 35px; color:var(--muted); font-size:12px; }.bar { flex:1; height:5px; overflow:hidden; border-radius:8px; background:#edf0e8; }.bar i { display:block; height:100%; background:var(--green); border-radius:inherit; transition:width .2s; }
      .subtasks { display:grid; gap:6px; margin-left:35px; }.subtask { display:flex; align-items:flex-start; gap:9px; color:#4f564d; }.subtask input:not(.sub-title) { accent-color:var(--green); margin-top:5px; }.subtask .drag-handle { margin-top:2px; font-size:15px; line-height:20px; }.sub-remove,.insert-sub { border:0; background:transparent; color:#adb1aa; opacity:0; margin-top:4px; }.insert-sub { font-size:17px; margin-top:1px; }.subtask:hover .sub-remove,.subtask:hover .insert-sub,.subtask:focus-within .sub-remove,.subtask:focus-within .insert-sub { opacity:1; }.insert-sub:hover { color:var(--green); }.sub-composer { display:flex; gap:7px; align-items:center; margin:5px 0 0 24px; }.sub-composer-input { flex:1; min-width:0; border:1px solid #cfd6bf; border-radius:8px; padding:7px 9px; outline-color:var(--green); background:#fbfcf7; }.composer-cancel { border:0; background:transparent; color:var(--muted); padding:5px; }.add-sub { margin:12px 0 0 35px; width:calc(100% - 35px); padding:7px 1px; border:0; border-bottom:1px dashed #cdd2c7; color:var(--muted); background:transparent; text-align:left; font-size:13px; }.add-sub:hover { color:var(--green); }
      dialog { width:min(450px, calc(100% - 32px)); padding:0; border:0; border-radius:18px; box-shadow:var(--shadow); } dialog::backdrop { background:rgba(27,34,25,.35); backdrop-filter:blur(3px); }.form { padding:25px; }.form h2 { margin:0 0 18px; letter-spacing:-.04em; }.form input { width:100%; padding:12px; border:1px solid var(--line); border-radius:10px; outline-color:var(--green); }.form-actions { display:flex; justify-content:end; gap:10px; margin-top:18px; }.secondary,.primary { border:0; border-radius:9px; padding:9px 14px; }.secondary { background:#edf0e8; }.primary { background:var(--ink); color:white; }
      .backup-dialog h2 { margin-bottom:7px; }.backup-intro { margin:0 0 20px; color:var(--muted); font-size:14px; line-height:1.6; }.backup-options { display:grid; gap:10px; }.backup-option { display:flex; align-items:center; justify-content:space-between; gap:18px; padding:15px; border:1px solid var(--line); border-radius:12px; background:#fbfcf8; }.backup-option b { display:block; margin-bottom:4px; }.backup-option p { margin:0; color:var(--muted); font-size:13px; line-height:1.45; }.import-input { display:none; }.backup-status { min-height:20px; margin:14px 0 0; color:var(--muted); font-size:13px; }.backup-status.error { color:#a33e35; }.backup-close { margin-top:16px; width:100%; }
      .memo-backdrop { position:fixed; inset:0; z-index:11; background:rgba(28,34,26,.18); backdrop-filter:blur(2px); opacity:0; pointer-events:none; transition:opacity .22s ease; }.memo-panel { position:fixed; z-index:12; top:0; right:0; bottom:0; left:auto; width:min(440px,calc(100vw - 28px)); padding:30px 25px; display:flex; flex-direction:column; gap:16px; background:var(--card); box-shadow:-18px 0 42px rgba(38,47,33,.12); transform:translateX(calc(100% + 24px)); transition:transform .24s ease; }.app.memo-open ~ .memo-backdrop { opacity:1; pointer-events:auto; }.app.memo-open ~ .memo-panel { transform:translateX(0); }.memo-head { display:flex; align-items:flex-start; justify-content:space-between; gap:15px; }.memo-head h2 { margin:0; font-size:22px; letter-spacing:-.04em; }.memo-head p { margin:5px 0 0; color:var(--muted); font-size:13px; }.memo-close { border:0; border-radius:9px; padding:5px 9px; color:var(--muted); background:#edf0e8; font-size:18px; line-height:1; }.memo-text { flex:1; min-height:0; width:100%; resize:none; border:1px solid var(--line); border-radius:14px; padding:14px; outline:none; color:var(--ink); background:#fbfcf8; font:15px/1.7 inherit; }.memo-text:focus { border-color:#9eb76e; box-shadow:0 0 0 3px rgba(164,196,99,.18); }.memo-foot { display:flex; align-items:center; justify-content:space-between; gap:12px; color:var(--muted); font-size:12px; }.memo-clear { border:0; padding:6px 0; color:#a35a52; background:transparent; }.memo-clear:hover { color:#8d3d36; }
      .empty { padding:45px 20px; color:var(--muted); text-align:center; border:1px dashed var(--line); border-radius:16px; }
      @media(min-width:1120px){.tasks{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:8px;grid-auto-flow:row dense;align-items:start}.task{align-self:start}} @media(max-width:720px){.app{width:calc(100% - 24px);padding:18px 0 28px}aside{left:0;width:min(300px,calc(100vw - 34px));padding:76px 16px 24px}.heading h1{font-size:28px}.heading-actions{gap:7px}.add-task,.backup-button,.memo-button{padding:10px 11px;font-size:13px}.summary{grid-template-columns:repeat(3,1fr)}.metric{padding:11px}.date{display:none}.task{padding:16px}.memo-panel{padding:24px 18px}.drag-handle,.insert-sub{opacity:1}}
    </style>
  </head>
  <body>
    <div class="app">
      <div class="drawer-backdrop" id="drawer-backdrop"></div>
      <header><div class="header-left"><button class="sidebar-toggle" id="sidebar-toggle" aria-label="收起分类菜单" title="收起分类菜单">☰</button><div class="brand"><span class="mark">✓</span>任务清单</div></div><div class="date" id="today"></div></header>
      <aside><nav class="nav" id="nav"><button class="active" data-filter="all">全部任务 <span class="count" id="all-count">0</span></button><button data-filter="active">进行中 <span class="count" id="active-count">0</span></button><button data-filter="done">已完成 <span class="count" id="done-count">0</span></button></nav><p class="tip">把一件大事拆成可以完成的小步骤，再逐项划掉。</p></aside>
      <div class="layout"><main><section class="heading"><div><h1 id="view-title">我的任务</h1><p id="view-desc">今天要推进什么？</p></div><div class="heading-actions"><button class="memo-button" id="open-memo" aria-expanded="false">备忘</button><button class="backup-button" id="open-backup">备份</button><button class="add-task" id="open-dialog">+ 新建任务</button></div></section><section class="summary" id="summary"></section><section class="tasks" id="tasks"></section></main></div>
    </div>
    <dialog id="task-dialog"><form class="form" id="task-form" method="dialog"><h2>新建一个任务</h2><input id="new-task-title" placeholder="例如：完成本周方案" required maxlength="200" autofocus /><div class="form-actions"><button class="secondary" type="button" id="cancel-dialog">取消</button><button class="primary" value="default">创建任务</button></div></form></dialog>
    <dialog id="backup-dialog"><div class="form backup-dialog"><h2>数据备份</h2><p class="backup-intro">任务数据保存在当前设备。定期保存备份文件，换电脑或清理应用数据后都能恢复。</p><div class="backup-options"><div class="backup-option"><div><b>保存备份</b><p>选择位置后，将当前全部任务保存为一个备份文件。</p></div><button class="secondary" id="export-backup">保存备份</button></div><div class="backup-option"><div><b>导入备份</b><p>导入会替换当前全部任务，请先保存一份最新备份。</p></div><button class="secondary" id="choose-backup">选择文件</button><input class="import-input" id="import-backup" type="file" accept="application/json,.json"></div></div><p class="backup-status" id="backup-status" role="status"></p><button class="secondary backup-close" id="close-backup">关闭</button></div></dialog>
    <div class="memo-backdrop" id="memo-backdrop"></div><aside class="memo-panel" aria-label="备忘录"><div class="memo-head"><div><h2>备忘录</h2><p>写下想反复提醒自己的话。</p></div><button class="memo-close" id="close-memo" aria-label="关闭备忘录">×</button></div><textarea class="memo-text" id="memo-text" maxlength="3000" placeholder="例如：\n今天先完成最小的一步。\n不要等状态好，行动会带来状态。"></textarea><div class="memo-foot"><span id="memo-status">自动保存</span><button class="memo-clear" id="clear-memo">清空内容</button></div></aside>
    <script>
      const key='task-list-v1',memoKey='task-list-memo-v1';
      const defaults=[{id:1,title:'准备产品发布',done:false,subs:[{id:11,text:'整理发布清单',done:true},{id:12,text:'确认页面文案',done:false},{id:13,text:'安排上线时间',done:false}]},{id:2,title:'本周学习计划',done:false,subs:[{id:21,text:'完成两节课程',done:false},{id:22,text:'整理学习笔记',done:false}]},{id:3,title:'回复合作消息',done:true,subs:[{id:31,text:'确认会议时间',done:true}]}];
      let tasks=JSON.parse(localStorage.getItem(key)||'null')||defaults, filter='all', sidebarOpen=localStorage.getItem('task-list-sidebar-open')==='true', memoOpen=false, subComposer=null, dragState=null;
      const $=s=>document.querySelector(s), uid=()=>Date.now()+Math.floor(Math.random()*1000);
      function save(){localStorage.setItem(key,JSON.stringify(tasks));render()} function saveDraft(){localStorage.setItem(key,JSON.stringify(tasks))} function backupName(){return `任务清单备份-${new Date().toISOString().slice(0,10)}.json`} function setBackupStatus(message,error=false){const el=$('#backup-status');el.textContent=message;el.classList.toggle('error',error)} function normalizeBackup(raw){if(!raw||raw.format!=='task-list-backup'||raw.version!==1||!Array.isArray(raw.tasks))throw new Error('这不是任务清单的备份文件。');const taskIds=new Set(),subIds=new Set(),restoredTasks=raw.tasks.map((task,index)=>{if(!task||typeof task.title!=='string'||!task.title.trim())throw new Error(`第 ${index+1} 个任务内容不正确。`);let taskId=Number(task.id);while(!Number.isFinite(taskId)||taskIds.has(taskId))taskId=uid();taskIds.add(taskId);const subs=Array.isArray(task.subs)?task.subs:[];return {id:taskId,title:task.title.trim().slice(0,200),done:Boolean(task.done),subs:subs.map((sub,subIndex)=>{if(!sub||typeof sub.text!=='string'||!sub.text.trim())throw new Error(`第 ${index+1} 个任务的第 ${subIndex+1} 个子事项不正确。`);let subId=Number(sub.id);while(!Number.isFinite(subId)||subIds.has(subId))subId=uid();subIds.add(subId);return {id:subId,text:sub.text.trim().slice(0,200),done:Boolean(sub.done)}})}});return {tasks:restoredTasks,memo:typeof raw.memo==='string'?raw.memo.slice(0,3000):''}}
      function filtered(){return tasks.filter(t=>filter==='all'||filter==='done'?filter==='all'||t.done:!t.done)}
      function stats(){let sub=tasks.flatMap(t=>t.subs), done=sub.filter(s=>s.done).length;return {total:tasks.length,open:tasks.filter(t=>!t.done).length,done:tasks.filter(t=>t.done).length,sub,checked:done}}
      function grow(el){el.style.height='auto';el.style.height=el.scrollHeight+'px'} function layoutTasks(){const wrap=$('#tasks'),cards=wrap.querySelectorAll('.task'),wide=matchMedia('(min-width:1120px)').matches;if(!wide){cards.forEach(card=>card.style.gridRowEnd='');return}cards.forEach(card=>card.style.gridRowEnd='span '+Math.ceil((card.getBoundingClientRect().height+12)/20))} function composerHtml(){return `<div class="sub-composer"><input class="sub-composer-input" maxlength="200" placeholder="输入子事项后按 Enter 保存" autofocus><button class="composer-cancel" title="取消">取消</button></div>`} function render(){const s=stats(); $('#all-count').textContent=s.total;$('#active-count').textContent=s.open;$('#done-count').textContent=s.done;const labels={all:['我的任务','今天要推进什么？'],active:['进行中','一次只专注一件事。'],done:['已完成','做得好，继续保持。']};$('#view-title').textContent=labels[filter][0];$('#view-desc').textContent=labels[filter][1];$('#summary').innerHTML=`<div class="metric"><b>${s.total}</b><span>全部任务</span></div><div class="metric"><b>${s.open}</b><span>等待完成</span></div><div class="metric"><b>${s.checked}/${s.sub.length}</b><span>子事项已完成</span></div>`;const list=filtered();$('#tasks').innerHTML=list.length?list.map(t=>taskHtml(t)).join(''):'<div class="empty">这里还没有任务。新建一个开始吧。</div>';document.querySelectorAll('.task-title,.sub-title').forEach(grow);requestAnimationFrame(()=>{layoutTasks();if(subComposer)document.querySelector('.sub-composer-input')?.focus()})}
      function taskHtml(t){let total=t.subs.length,checked=t.subs.filter(s=>s.done).length,pct=total?checked/total*100:(t.done?100:0),items=t.subs.map(s=>`<div class="subtask ${s.done?'completed':''}" data-sub="${s.id}"><input class="sub-check" type="checkbox" ${s.done?'checked':''}><span class="drag-handle" draggable="true" data-drag="sub" title="拖拽排序">⠿</span><textarea class="sub-title" rows="1" maxlength="200" aria-label="子事项" title="点击直接修改子事项">${escapeHtml(s.text)}</textarea><button class="insert-sub" title="在下方添加子事项" aria-label="在下方添加子事项">+</button><button class="sub-remove" title="删除子事项">×</button></div>${subComposer?.taskId===t.id&&subComposer.afterId===s.id?composerHtml():''}`).join('');return `<article class="task ${t.done?'done':''}" data-id="${t.id}"><div class="task-top"><input class="check task-check" type="checkbox" ${t.done?'checked':''} aria-label="完成任务"><span class="drag-handle" draggable="true" data-drag="task" title="拖拽排序">⠿</span><textarea class="task-title" rows="1" maxlength="200" aria-label="任务名称" title="点击直接修改任务">${escapeHtml(t.title)}</textarea><button class="delete" title="删除任务" aria-label="删除任务">×</button></div><div class="progress-row"><span>${checked}/${total} 个子事项</span><div class="bar"><i style="width:${pct}%"></i></div></div><div class="subtasks">${items}${subComposer?.taskId===t.id&&subComposer.afterId===null?composerHtml():''}</div><button class="add-sub">+ 添加子事项</button></article>`}
      const escapeHtml=t=>t.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
      $('#nav').addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;filter=b.dataset.filter;document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x===b));setSidebar(false);render()});
      $('#tasks').addEventListener('click',e=>{const card=e.target.closest('.task');if(!card)return;const t=tasks.find(x=>x.id==card.dataset.id);if(e.target.classList.contains('delete')){if(confirm(`删除“${t.title}”？`)){tasks=tasks.filter(x=>x!==t);save()}return}if(e.target.classList.contains('add-sub')){subComposer={taskId:t.id,afterId:null};render();return}if(e.target.classList.contains('insert-sub')){subComposer={taskId:t.id,afterId:Number(e.target.closest('.subtask').dataset.sub)};render();return}if(e.target.classList.contains('composer-cancel')){subComposer=null;render();return}if(e.target.classList.contains('sub-remove')){let sub=t.subs.find(x=>x.id==e.target.closest('.subtask').dataset.sub);t.subs=t.subs.filter(x=>x!==sub);save()}});
      $('#tasks').addEventListener('input',e=>{const card=e.target.closest('.task');if(!card)return;let t=tasks.find(x=>x.id==card.dataset.id);if(e.target.classList.contains('task-title'))t.title=e.target.value;if(e.target.classList.contains('sub-title')){let sub=t.subs.find(x=>x.id==e.target.closest('.subtask').dataset.sub);sub.text=e.target.value}if(e.target.matches('.task-title,.sub-title')){grow(e.target);saveDraft();requestAnimationFrame(layoutTasks)}});$('#tasks').addEventListener('keydown',e=>{if(e.target.matches('.sub-composer-input')){if(e.key==='Escape'){subComposer=null;render()}if(e.key==='Enter'){let text=e.target.value.trim();if(text){let t=tasks.find(x=>x.id==subComposer.taskId),at=subComposer.afterId===null?t.subs.length:t.subs.findIndex(s=>s.id===subComposer.afterId)+1;t.subs.splice(at,0,{id:uid(),text,done:false});subComposer=null;save()}return}return}if(e.key==='Enter'&&!e.shiftKey&&e.target.matches('.task-title,.sub-title')){e.preventDefault();e.target.blur()}});$('#tasks').addEventListener('change',e=>{const card=e.target.closest('.task');if(!card)return;let t=tasks.find(x=>x.id==card.dataset.id);if(e.target.classList.contains('task-check')){t.done=e.target.checked;t.subs.forEach(s=>s.done=t.done)}if(e.target.classList.contains('sub-check')){let sub=t.subs.find(x=>x.id==e.target.closest('.subtask').dataset.sub);sub.done=e.target.checked;t.done=t.subs.length>0&&t.subs.every(x=>x.done)}save()});window.addEventListener('resize',()=>requestAnimationFrame(layoutTasks));
      function clearDrop(){document.querySelectorAll('.drop-before,.drop-after').forEach(el=>el.classList.remove('drop-before','drop-after'))}function reorder(list,source,target,before){if(source===target)return;let from=list.indexOf(source);list.splice(from,1);let at=list.indexOf(target)+(before?0:1);list.splice(at,0,source)}function getDropTarget(e){if(!dragState)return null;const card=e.target.closest('.task');if(!card)return null;if(dragState.type==='task')return card;if(Number(card.dataset.id)!==dragState.taskId)return null;return e.target.closest('.subtask')}$('#tasks').addEventListener('dragstart',e=>{const handle=e.target.closest('.drag-handle');if(!handle)return;const card=handle.closest('.task'),sub=handle.closest('.subtask');dragState=sub?{type:'sub',taskId:Number(card.dataset.id),subId:Number(sub.dataset.sub)}:{type:'task',taskId:Number(card.dataset.id)};e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain','sort');setTimeout(()=> (sub||card).classList.add('dragging'))});$('#tasks').addEventListener('dragover',e=>{const target=getDropTarget(e);if(!target)return;e.preventDefault();clearDrop();const rect=target.getBoundingClientRect(),before=e.clientY<rect.top+rect.height/2;target.classList.add(before?'drop-before':'drop-after')});$('#tasks').addEventListener('drop',e=>{const target=getDropTarget(e);if(!target){clearDrop();return}e.preventDefault();const before=target.classList.contains('drop-before');if(dragState.type==='task'){const source=tasks.find(t=>t.id===dragState.taskId),destination=tasks.find(t=>t.id===Number(target.dataset.id));reorder(tasks,source,destination,before)}else{const task=tasks.find(t=>t.id===dragState.taskId),source=task.subs.find(s=>s.id===dragState.subId),destination=task.subs.find(s=>s.id===Number(target.dataset.sub));reorder(task.subs,source,destination,before)}document.querySelector('.dragging')?.classList.remove('dragging');dragState=null;clearDrop();save()});$('#tasks').addEventListener('dragend',()=>{document.querySelector('.dragging')?.classList.remove('dragging');dragState=null;clearDrop()});
      function syncSidebar(){document.querySelector('.app').classList.toggle('sidebar-open',sidebarOpen);const button=$('#sidebar-toggle');button.setAttribute('aria-expanded',String(sidebarOpen));button.setAttribute('aria-label',sidebarOpen?'收起分类菜单':'展开分类菜单');button.title=sidebarOpen?'收起分类菜单':'展开分类菜单'}function setSidebar(open){sidebarOpen=open;localStorage.setItem('task-list-sidebar-open',String(open));syncSidebar()}function setMemo(open){memoOpen=open;document.querySelector('.app').classList.toggle('memo-open',open);$('#open-memo').setAttribute('aria-expanded',String(open));if(open)setTimeout(()=>$('#memo-text').focus(),180)}const dlg=$('#task-dialog'),backupDlg=$('#backup-dialog');$('#open-dialog').onclick=()=>{dlg.showModal();$('#new-task-title').focus()};$('#cancel-dialog').onclick=()=>dlg.close();$('#task-form').addEventListener('submit',e=>{e.preventDefault();let title=$('#new-task-title').value.trim();if(title){tasks.unshift({id:uid(),title,done:false,subs:[]});$('#new-task-title').value='';dlg.close();save()}});$('#open-backup').onclick=()=>{setBackupStatus('');backupDlg.showModal()};$('#close-backup').onclick=()=>backupDlg.close();$('#export-backup').onclick=async()=>{const content=JSON.stringify({format:'task-list-backup',version:1,exportedAt:new Date().toISOString(),tasks,memo:localStorage.getItem(memoKey)||''},null,2),invoke=window.__TAURI__?.core?.invoke;if(!invoke){setBackupStatus('当前桌面版不支持选择保存位置，请安装最新版本。',true);return}setBackupStatus('正在选择保存位置…');try{const path=await invoke('save_backup',{content,defaultName:backupName()});setBackupStatus(path?`备份已保存到：${path}`:'已取消保存。')}catch(error){setBackupStatus(String(error||'无法保存备份。'),true)}};$('#choose-backup').onclick=()=>$('#import-backup').click();$('#import-backup').addEventListener('change',e=>{const file=e.target.files[0];e.target.value='';if(!file)return;if(file.size>5*1024*1024){setBackupStatus('文件太大，无法导入。',true);return}const reader=new FileReader();reader.onload=()=>{try{const restored=normalizeBackup(JSON.parse(reader.result));if(!confirm(`将恢复 ${restored.tasks.length} 个任务，并替换当前任务。确定继续吗？`))return;tasks=restored.tasks;subComposer=null;if(restored.memo)localStorage.setItem(memoKey,restored.memo);else localStorage.removeItem(memoKey);memoText.value=restored.memo;save();setBackupStatus(`已恢复 ${restored.tasks.length} 个任务和备忘录。`)}catch(error){setBackupStatus(error.message||'无法读取这个备份文件。',true)}};reader.onerror=()=>setBackupStatus('读取文件失败，请再试一次。',true);reader.readAsText(file,'utf-8')});const memoText=$('#memo-text');memoText.value=localStorage.getItem(memoKey)||'';$('#open-memo').onclick=()=>setMemo(true);$('#close-memo').onclick=()=>setMemo(false);$('#memo-backdrop').onclick=()=>setMemo(false);memoText.addEventListener('input',()=>{localStorage.setItem(memoKey,memoText.value);$('#memo-status').textContent='已自动保存'});$('#clear-memo').onclick=()=>{if(!memoText.value||confirm('清空备忘录内容？')){memoText.value='';localStorage.removeItem(memoKey);$('#memo-status').textContent='内容已清空'}};$('#sidebar-toggle').onclick=()=>setSidebar(!sidebarOpen);$('#drawer-backdrop').onclick=()=>setSidebar(false);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sidebarOpen)setSidebar(false);if(e.key==='Escape'&&memoOpen)setMemo(false)});$('#today').textContent=new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',weekday:'long'}).format(new Date());syncSidebar();render();
    </script>
